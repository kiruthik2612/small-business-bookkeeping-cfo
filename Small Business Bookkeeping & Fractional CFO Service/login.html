<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal Login — Finora</title>
  <meta name="description" content="Access your live financial dashboard, monthly close reports, and fractional CFO messages securely.">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    /* Professional Login Form Card Outline & Container */
    .login-container-card {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      box-shadow: 0 4px 20px -2px rgba(12, 26, 48, 0.06), 0 2px 6px -1px rgba(12, 26, 48, 0.04);
      padding: 2.25rem 2.25rem 2rem;
      transition: background-color var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    [data-theme="dark"] .login-container-card {
      background: var(--bg-surface);
      border-color: #334155;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.45);
    }

    /* Top-right Controls Positioning */
    .login-top-controls {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 100;
    }

    [dir="rtl"] .login-top-controls {
      right: auto;
      left: 1.5rem;
    }

    @media (max-width: 576px) {
      .login-container-card {
        padding: 1.75rem 1.25rem 1.5rem;
        border-radius: 12px;
      }
      .login-top-controls {
        top: 1rem;
        right: 1rem;
      }
      [dir="rtl"] .login-top-controls {
        right: auto;
        left: 1rem;
      }
    }

    @media (max-width: 360px) {
      .login-container-card {
        padding: 1.5rem 1rem 1.25rem;
      }
    }
  </style>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; background: var(--bg-body); margin: 0; padding: 2rem 1rem;">

  <!-- TOP-RIGHT CONTROLS (DARK MODE & RTL - OUTSIDE LOGIN CONTAINER) -->
  <div class="login-top-controls">
    <div class="header-actions" style="display: flex; gap: 0.5rem; align-items: center;">
      <button class="theme-toggle-btn" aria-label="Toggle Theme"><i class="bi bi-moon-stars-fill"></i></button>
      <button class="rtl-toggle-btn" aria-label="Toggle RTL"><span style="font-weight:700; font-size: 0.8rem;">RTL</span></button>
    </div>
  </div>

  <!-- AUTH MAIN CONTAINER -->
  <main id="main-content" style="width: 100%; display: flex; align-items: center; justify-content: center; padding: 1rem 0;">
    <div class="login-container-card">
      
      <!-- Brand Logo, Title & Subtitle inside the container -->
      <div class="text-center" style="margin-bottom: 1.5rem;">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 1.25rem; text-decoration: none;">
          <div class="logo-icon"><i class="bi bi-graph-up-arrow"></i></div>
          <div class="logo-text" style="text-align: left;">
            <span class="logo-name">Finora</span>
            <span class="logo-sub">Client Portal</span>
          </div>
        </a>
        <h1 style="font-size: 1.65rem; margin-bottom: 0.35rem;">Sign In to Finora</h1>
        <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0;">Enter your credentials to access your financial dashboard.</p>
      </div>

      <!-- Login Error Alert Box (Account Not Found or Invalid Credentials) -->
      <div id="login-error-alert" style="display: none; margin-bottom: 1.25rem; padding: 1rem 1.15rem; border-radius: var(--radius-md); background: rgba(239, 68, 68, 0.1); border: 1.5px solid var(--danger-color); color: var(--text-main);">
        <div class="flex items-start gap-3">
          <i class="bi bi-exclamation-triangle-fill" style="font-size: 1.25rem; color: var(--danger-color); flex-shrink: 0; margin-top: 2px;"></i>
          <div>
            <h4 id="login-error-title" style="font-size: 0.95rem; margin-bottom: 0.2rem; color: var(--danger-color);">Authentication Error</h4>
            <p id="login-error-message" style="font-size: 0.85rem; margin: 0; color: var(--text-main);">Invalid email or password.</p>
          </div>
        </div>
      </div>

      <!-- Login Success Alert Box (displayed after clicking login button) -->
      <div id="login-success-alert" style="display: none; margin-bottom: 1.25rem; padding: 1rem 1.15rem; border-radius: var(--radius-md); background: var(--accent-soft); border: 1.5px solid var(--accent-color); color: var(--text-main);">
        <div class="flex items-start gap-3">
          <i class="bi bi-check-circle-fill" style="font-size: 1.25rem; color: var(--accent-color); flex-shrink: 0; margin-top: 2px;"></i>
          <div>
            <h4 style="font-size: 0.95rem; margin-bottom: 0.2rem; color: var(--accent-hover);">Login successful!</h4>
            <p style="font-size: 0.85rem; margin: 0; color: var(--text-muted);">Welcome back to Finora. You are now logged into your session.</p>
          </div>
        </div>
      </div>

      <!-- Login Form with Frontend-Only Demo Logic -->
      <form id="login-form" novalidate>
        <div class="form-group" style="margin-bottom: 1.1rem;">
          <label class="form-label" for="login-email" style="font-size: 0.9rem;">Business Email <span style="color: var(--danger-color);">*</span></label>
          <input type="email" id="login-email" class="form-control" placeholder="founder@yourcompany.com" required>
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <div class="flex justify-between items-center" style="margin-bottom: 0.4rem;">
            <label class="form-label" for="login-password" style="margin: 0; font-size: 0.9rem;">Password <span style="color: var(--danger-color);">*</span></label>
            <a href="javascript:void(0)" id="forgot-password-link" style="font-size: 0.8rem; color: var(--secondary-color); font-weight: 600;">Forgot password?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required>
        </div>

        <div class="form-group flex justify-between items-center" style="margin-bottom: 1.25rem;">
          <label class="form-check" style="font-size: 0.85rem;">
            <input type="checkbox" id="remember-me" checked>
            <span>Remember for 30 days</span>
          </label>
        </div>

        <!-- SSO Single Sign-On Buttons -->
        <div class="sso-buttons-group" style="display: flex; flex-direction: column; gap: 0.65rem; margin-bottom: 1.15rem;">
          <button type="button" id="google-sso-btn" class="btn-sso" aria-label="Sign in with Google">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.04 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            <span>Continue with Google</span>
          </button>
          
          <button type="button" id="apple-sso-btn" class="btn-sso" aria-label="Sign in with Apple">
            <i class="bi bi-apple"></i>
            <span>Continue with Apple</span>
          </button>
        </div>

        <div class="auth-divider">or with email</div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-lg" style="width: 100%; justify-content: center; margin-bottom: 1.25rem;">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>

        <div class="text-center" style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0;">
          Don't have an account? <a href="register.html" style="font-weight: 600; color: var(--secondary-color);">Sign Up</a>
        </div>
      </form>
    </div>
  </main>

  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/validation.js" defer></script>
</body>
</html>
