<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Finora Bookkeeping & Fractional CFO</title>
  <meta name="description" content="Create your Finora account to access dedicated bookkeeping, automated reconciliation, and executive fractional CFO advisory.">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    /* Professional Sign Up Form Card Outline & Container (matching Login page) */
    .signup-container-card {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      box-shadow: 0 4px 20px -2px rgba(12, 26, 48, 0.06), 0 2px 6px -1px rgba(12, 26, 48, 0.04);
      padding: 2.25rem 2.25rem 2rem;
      transition: background-color var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    [data-theme="dark"] .signup-container-card {
      background: var(--bg-surface);
      border-color: #334155;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.45);
    }

    /* Top-right Controls Positioning */
    .signup-top-controls {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 100;
    }

    [dir="rtl"] .signup-top-controls {
      right: auto;
      left: 1.5rem;
    }

    @media (max-width: 576px) {
      .signup-container-card {
        padding: 1.75rem 1.25rem 1.5rem;
        border-radius: 12px;
      }
      .signup-top-controls {
        top: 1rem;
        right: 1rem;
      }
      [dir="rtl"] .signup-top-controls {
        right: auto;
        left: 1rem;
      }
    }

    @media (max-width: 360px) {
      .signup-container-card {
        padding: 1.5rem 1rem 1.25rem;
      }
    }
  </style>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; background: var(--bg-body); margin: 0; padding: 2rem 1rem;">

  <!-- TOP-RIGHT CONTROLS (DARK MODE & RTL - OUTSIDE SIGNUP CONTAINER) -->
  <div class="signup-top-controls">
    <div class="header-actions" style="display: flex; gap: 0.5rem; align-items: center;">
      <button class="theme-toggle-btn" aria-label="Toggle Theme"><i class="bi bi-moon-stars-fill"></i></button>
      <button class="rtl-toggle-btn" aria-label="Toggle RTL"><span style="font-weight:700; font-size: 0.8rem;">RTL</span></button>
    </div>
  </div>

  <!-- AUTH MAIN CONTAINER -->
  <main id="main-content" style="width: 100%; display: flex; align-items: center; justify-content: center; padding: 1rem 0;">
    <div class="signup-container-card">
      
      <div class="text-center" style="margin-bottom: 1.5rem;">
        <!-- Centered Brand Logo inside card -->
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 1.25rem; text-decoration: none;">
          <div class="logo-icon"><i class="bi bi-graph-up-arrow"></i></div>
          <div class="logo-text" style="text-align: left;">
            <span class="logo-name">Finora</span>
            <span class="logo-sub">Bookkeeping & CFO</span>
          </div>
        </a>
        <h1 style="font-size: 1.65rem; margin-bottom: 0.35rem;">Create Your Account</h1>
        <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0;">Join Finora to streamline your bookkeeping & financial advisory.</p>
      </div>

      <!-- Registration Form with Frontend Demo Logic -->
      <form id="signup-form" novalidate>
        <!-- Name -->
        <div class="form-group" style="margin-bottom: 1.1rem;">
          <label class="form-label" for="register-name" style="font-size: 0.9rem;">Full Name <span style="color: var(--danger-color);">*</span></label>
          <input type="text" id="register-name" class="form-control" placeholder="Jane Doe" required>
        </div>

        <!-- Email -->
        <div class="form-group" style="margin-bottom: 1.1rem;">
          <label class="form-label" for="register-email" style="font-size: 0.9rem;">Business Email <span style="color: var(--danger-color);">*</span></label>
          <input type="email" id="register-email" class="form-control" placeholder="jane@company.com" required>
        </div>

        <!-- Password -->
        <div class="form-group" style="margin-bottom: 1.1rem;">
          <label class="form-label" for="register-password" style="font-size: 0.9rem;">Password <span style="color: var(--danger-color);">*</span></label>
          <input type="password" id="register-password" class="form-control" placeholder="••••••••••••" required>
          <div style="margin-top: 0.4rem;">
            <div style="height: 4px; width: 100%; background: var(--bg-surface-alt); border-radius: var(--radius-full); overflow: hidden;">
              <div id="password-strength-bar" style="height: 100%; width: 0%; transition: all var(--transition-fast);"></div>
            </div>
            <span id="password-strength-text" style="font-size: 0.75rem; display: block; margin-top: 0.25rem;"></span>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group" style="margin-bottom: 1.1rem;">
          <label class="form-label" for="confirm-password" style="font-size: 0.9rem;">Confirm Password <span style="color: var(--danger-color);">*</span></label>
          <input type="password" id="confirm-password" class="form-control" placeholder="••••••••••••" required>
        </div>

        <!-- Terms checkbox -->
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-check" style="font-size: 0.85rem; color: var(--text-muted); align-items: flex-start;">
            <input type="checkbox" id="register-terms" required style="margin-top: 0.25rem;">
            <span>I agree to the <a href="#" style="color: var(--secondary-color);">Terms of Service</a> &amp; <a href="#" style="color: var(--secondary-color);">Privacy Policy</a>.</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="signup-btn" class="btn btn-accent btn-lg" style="width: 100%; justify-content: center; margin-bottom: 1.25rem;">
          <i class="bi bi-person-check-fill"></i> Create Account
        </button>

        <div class="text-center" style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0;">
          Already have an account? <a href="login.html" style="font-weight: 600; color: var(--secondary-color);">Sign In</a>
        </div>
      </form>
    </div>
  </main>

  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/validation.js" defer></script>
</body>
</html>
